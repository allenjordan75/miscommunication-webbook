<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Muller-Lyer illusion: same length, different perception</title>
  <desc id="desc">Two horizontal lines of the same length are shown with different arrow fins. The upper line has outward-facing fins and the lower line has inward-facing fins, making the equal lines appear different in length.</desc>
  <rect width="1200" height="700" fill="#fff1dd"/>
  <rect x="40" y="40" width="1120" height="620" rx="18" fill="#fffdf8" stroke="#d8c9b8" stroke-width="3"/>
  <text x="600" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#8f4525">THE MULLER-LYER ILLUSION</text>
  <text x="600" y="155" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#151515">Same line length. Different perceptual organization.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="900">
    <rect x="135" y="225" width="170" height="76" rx="12" fill="#eef2e8" stroke="#34704c" stroke-width="4"/>
    <text x="220" y="274" text-anchor="middle" font-size="34" fill="#34704c">Line A</text>
    <rect x="135" y="400" width="170" height="76" rx="12" fill="#fff7db" stroke="#b85f32" stroke-width="4"/>
    <text x="220" y="449" text-anchor="middle" font-size="34" fill="#8f4525">Line B</text>
  </g>

  <g fill="none" stroke="#151515" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <line x1="390" y1="260" x2="930" y2="260"/>
    <line x1="390" y1="260" x2="335" y2="205"/>
    <line x1="390" y1="260" x2="335" y2="315"/>
    <line x1="930" y1="260" x2="985" y2="205"/>
    <line x1="930" y1="260" x2="985" y2="315"/>

    <line x1="390" y1="435" x2="930" y2="435"/>
    <line x1="390" y1="435" x2="445" y2="380"/>
    <line x1="390" y1="435" x2="445" y2="490"/>
    <line x1="930" y1="435" x2="875" y2="380"/>
    <line x1="930" y1="435" x2="875" y2="490"/>
  </g>

  <line x1="390" y1="535" x2="930" y2="535" stroke="#34704c" stroke-width="5" stroke-dasharray="12 12" stroke-linecap="round"/>
  <text x="660" y="580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="900" fill="#34704c">The center lines are identical.</text>
  <text x="660" y="620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#5b514a">The fins change how the lines are organized, so equal lengths can feel unequal.</text>
</svg>
